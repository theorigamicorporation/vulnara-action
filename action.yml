name: 'Vulnara Scan'
description: 'Run a Vulnara security scan on a branch from CI using a service account, and optionally gate the build on findings.'
author: 'Vulnara'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  service-account:
    description: 'Vulnara service account username.'
    required: true
  token:
    description: 'Vulnara service account token (password). Store it as a GitHub secret.'
    required: true
  tenant:
    description: 'Vulnara tenant (workspace) id the service account belongs to.'
    required: true
  scan-tools:
    description: 'Comma-separated scan tool ids to run on the repository. Names are not accepted. List the ids with `vulnara docker_scan_tools` (vulnara-cli) or the GraphQL query `dockerScanTools { id categories }`. Required unless web-target-id or web-url is set.'
    required: false
    default: ''
  branch:
    description: 'Branch to scan. Defaults to the branch that triggered the workflow or pipeline.'
    required: false
    default: ''
  repository:
    description: 'owner/name of the repository to scan in Vulnara. Defaults to the current repository (GitHub) or project path (GitLab).'
    required: false
    default: ''
  git-token-id:
    description: 'Vulnara git token id to use for cloning (required for private repositories).'
    required: false
    default: ''
  fail-on:
    description: 'Fail the job if a finding at or above this severity is found: none | low | medium | high | critical.'
    required: false
    default: 'critical'
  create-issue:
    description: 'Create an issue in the repository for findings.'
    required: false
    default: 'false'
  auto-remediate:
    description: 'Open a fix pull request for findings (requires create-issue).'
    required: false
    default: 'false'
  wait-timeout:
    description: 'Max seconds to wait for each scan (repository or web application) to finish before failing.'
    required: false
    default: '1800'
  poll-interval:
    description: 'Seconds between scan status checks.'
    required: false
    default: '15'
  web-target-id:
    description: 'Id of an existing Vulnara web target to run a web application scan on, e.g. after deploying a preview. Its findings feed the same fail-on gate. Mutually exclusive with web-url.'
    required: false
    default: ''
  web-url:
    description: 'Base URL of a web application to scan. The web target registered for it is reused, or the URL is registered as a new web target. Requires web-ownership-consent: true. Mutually exclusive with web-target-id.'
    required: false
    default: ''
  web-ownership-consent:
    description: 'Set to exactly "true" to confirm you own the application at web-url or are authorised to scan it. Required for web-url; registering a target records this attestation.'
    required: false
    default: 'false'
  app-url:
    description: 'Vulnara web app base URL, used to build links to scans in the platform (override for non-prod).'
    required: false
    default: 'https://vulnara.rso.dev'
  gateway-url:
    description: 'Vulnara GraphQL gateway URL (override for non-prod).'
    required: false
    default: 'https://vulnara-gw.rso.dev/graphql'
  token-url:
    description: 'OAuth token endpoint (override for non-prod).'
    required: false
    default: 'https://auth.theorigamicorporation.com/application/o/token/'
  oauth-client-id:
    description: 'OAuth client id used for the service-account token exchange (override for non-prod).'
    required: false
    default: 'hl04e6MSMRY60LdpGh5rdMRQjkPxvldAYoqXdzo4'
  ci-platform:
    description: 'CI platform to behave as: github, gitlab or none. Empty detects it from the environment.'
    required: false
    default: ''
  report-dir:
    description: 'Directory for outputs.env and summary.md on platforms without a step summary (GitLab). Empty means .vulnara in the project directory on GitLab, and no files elsewhere.'
    required: false
    default: ''

outputs:
  scan-result-ids:
    description: 'Space-separated ids of the scan results that were started.'
  highest-severity:
    description: 'The highest finding severity discovered across the scans (or "none").'
  passed:
    description: '"true" if the scans passed the fail-on gate, "false" otherwise.'
  web-target-id:
    description: 'Id of the web target that was scanned, when a web application scan ran.'
  web-scan-result-id:
    description: 'Id of the web application scan result, when one ran.'

runs:
  using: 'docker'
  image: 'Dockerfile'
