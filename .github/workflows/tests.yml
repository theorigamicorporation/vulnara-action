name: tests

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. Superseded PR runs are cancelled so a shared self-hosted
# runner set is not spent finishing work nobody is waiting for. Runs on the
# default branch are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Show tool versions
        run: |
          bash --version | head -1
          jq --version
          shellcheck --version | head -3

      - name: Lint shell sources
        run: shellcheck -S warning entrypoint.sh test/run-tests.sh test/lib/harness.sh test/stubs/* test/*_test.sh

      - name: Run the test suite
        run: ./test/run-tests.sh

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Build the action image
        run: docker build -t vulnara-action:ci .
